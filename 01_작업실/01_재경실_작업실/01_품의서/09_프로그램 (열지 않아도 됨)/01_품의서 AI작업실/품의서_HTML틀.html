<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>품의서 본문</title>
</head>
<body>
<!-- 품의서 본문 HTML 틀. 쓰는 모양만 보이는 틀이다. [ ] 자리에 품의 내용이 들어간다. 줄마다 전자결재 편집기 모양(본고딕 · 12pt · 줄간격 1.5)을 넣고, 빈 줄은 <br> -->
<!-- 본문 맨 위 한 칸 띄우기 -->
<p style="font-family: 본고딕; font-size: 12pt; line-height: 1.5; margin-top: 0px; margin-bottom: 0px;"><br></p>
<!-- 문단 처음 공백 5칸 -->
<p style="font-family: 본고딕; font-size: 12pt; line-height: 1.5; margin-top: 0px; margin-bottom: 0px;">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;[서두 문장]</p>
<p style="font-family: 본고딕; font-size: 12pt; line-height: 1.5; margin-top: 0px; margin-bottom: 0px;"><br></p>
<!-- 「아래」 줄 : 가운데 정렬 대신 앞 공백으로 가운데쯤 -->
<p style="font-family: 본고딕; font-size: 12pt; line-height: 1.5; margin-top: 0px; margin-bottom: 0px;">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;-----&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;아&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;래&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;-----</p>
<p style="font-family: 본고딕; font-size: 12pt; line-height: 1.5; margin-top: 0px; margin-bottom: 0px;"><br></p>
<!-- 문서 작성 체계 1. > 가. > (1) > (가) > - , 하위 번호는 윗 단계 글자 위치쯤에서 시작 (앞 공백 5 / 8 / 12 / 16 / 21칸 = 변환설정.json 깊이별_앞공백) -->
<p style="font-family: 본고딕; font-size: 12pt; line-height: 1.5; margin-top: 0px; margin-bottom: 0px;">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;1. [항목]</p>
<p style="font-family: 본고딕; font-size: 12pt; line-height: 1.5; margin-top: 0px; margin-bottom: 0px;">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;가. [항목]</p>
<p style="font-family: 본고딕; font-size: 12pt; line-height: 1.5; margin-top: 0px; margin-bottom: 0px;">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;(1) [항목]</p>
<p style="font-family: 본고딕; font-size: 12pt; line-height: 1.5; margin-top: 0px; margin-bottom: 0px;">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;(가) [항목]</p>
<p style="font-family: 본고딕; font-size: 12pt; line-height: 1.5; margin-top: 0px; margin-bottom: 0px;">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;- [항목]</p>
<!-- 한 줄이 한글 48.5자 폭을 넘으면 띄어쓰기 자리에서 미리 나누고, 다음 줄은 번호 뒤 글자 위치에서 시작 -->
<p style="font-family: 본고딕; font-size: 12pt; line-height: 1.5; margin-top: 0px; margin-bottom: 0px;">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;나. [긴 항목 앞부분]</p>
<p style="font-family: 본고딕; font-size: 12pt; line-height: 1.5; margin-top: 0px; margin-bottom: 0px;">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;[긴 항목 나머지]</p>
<p style="font-family: 본고딕; font-size: 12pt; line-height: 1.5; margin-top: 0px; margin-bottom: 0px;"><br></p>
<!-- 큰 번호 항목 사이 한 칸 띄우기 -->
<p style="font-family: 본고딕; font-size: 12pt; line-height: 1.5; margin-top: 0px; margin-bottom: 0px;">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;2. [항목]</p>
<!-- 맨 끝은 끝. -->
<p style="font-family: 본고딕; font-size: 12pt; line-height: 1.5; margin-top: 0px; margin-bottom: 0px;">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;가. [항목]. 끝.</p>
</body>
</html>
